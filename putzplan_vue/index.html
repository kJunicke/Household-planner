<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">

    <!-- Aussehen-Umschalter (Pinnwand-Redesign): MUSS synchron und VOR dem
         ersten Stylesheet laufen. Das gebaute CSS ist render-blockierend und
         enthaelt den klassischen :root-Satz; das Modul-Script ist deferred und
         liefe erst nach dem HTML-Parsing — der Browser duerfte also kurz den
         klassischen Grund malen (Weiss-Blitz vor Kork).
         Bewusst generisch gehalten: nur der Storage-Schluessel wird hier
         gedoppelt (Gegenstueck: STORAGE_KEY in src/lib/design.ts), neue Modi
         brauchen keine Aenderung. Jeder Fehler faellt still auf klassisch. -->
    <script>
      try {
        var d = localStorage.getItem('putzplan.design');
        if (d && d !== 'classic' && /^[a-z-]{1,32}$/.test(d)) {
          document.documentElement.setAttribute('data-design', d);
        }
      } catch (e) {
        /* localStorage gesperrt o. ae. — klassisches Aussehen */
      }
    </script>

    <link rel="icon" href="/favicon.ico">
    <!-- interactive-widget=resizes-content: Android Chrome verkleinert damit beim
         Öffnen der Tastatur auch den Layout-Viewport, sodass Modal-Footer sichtbar
         bleiben. iOS Safari ignoriert es — dafür useVisualViewportHeight(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Gamifizierte Shared-Household Task-App">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Household Planner</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
